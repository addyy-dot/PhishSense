<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishSense - Smart Phishing Detection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-shield-alt"></i>
                <span>PHISHSENSE</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#usecases" class="nav-link">Usecases</a></li>
                <li class="dropdown">
                    <a href="#help" class="nav-link">Help <i class="fas fa-chevron-down"></i></a>
                    <div class="dropdown-menu">
                        <a href="#faq">FAQ</a>
                        <a href="#contact">Contact</a>
                        <a href="#support">Support</a>
                    </div>
                </li>
                <li><a href="#guide" class="nav-link download-btn">Download Guide <i class="fas fa-download"></i></a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1 class="hero-title">SMART PHISHING DETECTION</h1>
            <p class="hero-subtitle">Intelligent protection against phishing attacks and malicious websites</p>
            
            <div class="search-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="urlInput" 
                        class="url-input" 
                        placeholder="Enter a URL link in format http or https"
                        aria-label="URL Input"
                    >
                    <button id="scanBtn" class="scan-btn" aria-label="Scan URL">
                        <span class="btn-text">Scan URL</span>
                        <span class="btn-loader" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </span>
                    </button>
                </div>
                <p class="input-hint">Example: https://example.com</p>
            </div>

            <div class="illustration">
                <svg viewBox="0 0 400 300" class="laptop-svg">
                    <!-- Laptop Body -->
                    <rect x="50" y="20" width="300" height="180" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
                    
                    <!-- Screen -->
                    <rect x="60" y="30" width="280" height="160" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
                    
                    <!-- Screen Content -->
                    <circle cx="140" cy="70" r="6" fill="#fbbf24"/>
                    <rect x="100" y="95" width="80" height="40" fill="#fbbf24" opacity="0.3" rx="2"/>
                    <line x1="70" y1="120" x2="150" y2="120" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
                    <line x1="70" y1="130" x2="120" y2="130" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
                    
                    <!-- Keyboard -->
                    <rect x="50" y="210" width="300" height="30" fill="#1f2937" rx="2"/>
                    <rect x="55" y="215" width="290" height="20" fill="#111827" rx="2"/>
                    
                    <!-- Keyboard Keys -->
                    <g opacity="0.4">
                        <rect x="60" y="218" width="12" height="12" fill="#6b7280" rx="1"/>
                        <rect x="77" y="218" width="12" height="12" fill="#6b7280" rx="1"/>
                        <rect x="94" y="218" width="12" height="12" fill="#6b7280" rx="1"/>
                        <rect x="200" y="218" width="40" height="12" fill="#6b7280" rx="1"/>
                    </g>

                    <!-- Character -->
                    <circle cx="280" cy="90" r="20" fill="#1f2937"/>
                    <circle cx="280" cy="60" r="12" fill="#f59e0b"/>
                    
                    <!-- Shield/Security Icon -->
                    <g transform="translate(320, 50)">
                        <path d="M 0 5 L 15 0 L 15 15 Q 15 25 0 30 Q -15 25 -15 15 L -15 0 Z" 
                              fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
                        <path d="M -3 12 L 0 15 L 6 9" 
                              fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                </svg>
            </div>
        </div>
    </section>

    <!-- Results Section -->
    <section class="results-section" id="results" style="display: none;">
        <div class="results-container">
            <div class="result-card" id="resultCard">
                <div class="result-header">
                    <h2>Scan Result</h2>
                    <button class="close-btn" id="closeResult">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="result-body" id="resultBody">
                    <!-- Result content will be inserted here -->
                </div>
                
                <div class="result-details" id="resultDetails">
                    <!-- Additional details -->
                </div>

                <button class="scan-again-btn" id="scanAgainBtn">
                    <i class="fas fa-redo"></i> Scan Another URL
                </button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
